# Opt-in per-launch overlay. DSH reads its own stored authentication.
# No credentials are embedded here; the user's persistent profiles are untouched.
# https://github.com/deepseek-ai/deepseek-harness/blob/master/packages/bundle/headless/README.md#credentials
- id: credentials
  disabled: false
- id: authorization
  disabled: false
- id: deepseek-account
  disabled: false
- id: agent-default-model
  config:
    provider: deepseek-account
    model: deepseek-flash
